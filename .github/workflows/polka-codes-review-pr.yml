name: Polka Codes Review PR Handler

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-pr-${{ github.event.inputs.pr_number || github.event.number }}
  cancel-in-progress: true

jobs:
  review_polka:
    name: Review With Polka Codes
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Polka Codes configuration
        id: check-polka-config
        shell: bash
        env:
          POLKA_BASE_URL: ${{ secrets.POLKA_BASE_URL }}
          POLKA_API_KEY: ${{ secrets.POLKA_API_KEY }}
        run: |
          if [[ -n "$POLKA_BASE_URL" && -n "$POLKA_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Polka Codes secrets are not configured; skipping review."
          fi

      - name: Run Polka Codes
        if: steps.check-polka-config.outputs.enabled == 'true'
        uses: polka-codes/action@master
        with:
          pr_number: ${{ github.event.inputs.pr_number || github.event.number }}
          review: true
        env:
          POLKA_API_PROVIDER: openai-compatible
          POLKA_BASE_URL: ${{ secrets.POLKA_BASE_URL }}
          POLKA_API_KEY: ${{ secrets.POLKA_API_KEY }}
          POLKA_MODEL: gpt-5.6-sol
          GITHUB_TOKEN: ${{ github.token }}
